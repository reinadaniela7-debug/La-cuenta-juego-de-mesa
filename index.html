<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Necesidades de feedback del equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
/* Layout: una sola columna centrada, una pregunta por pantalla, navegación fija abajo */
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --ink:#1B1B19; --muted:#6C6B66; --faint:#9B9A93;
  --line:#E3E1DA; --line-strong:#CFCCC3; --track:#EFEDE7;
  --accent:#1F5C57; --accent-ink:#FFFFFF; --accent-soft:#E4EEEC;
  --coin:#C9952B; --coin-soft:#F6ECD6; --danger:#A8432F; --warn-soft:#FBEFE6;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413; --surface:#1D1D1B; --ink:#EDECE7; --muted:#A09F98; --faint:#76756F;
  --line:#2D2D2A; --line-strong:#3D3C38; --track:#2A2A27;
  --accent:#7FC2B8; --accent-ink:#0F1E1C; --accent-soft:#1F2F2D;
  --coin:#E0B455; --coin-soft:#3A3122; --danger:#E08A74; --warn-soft:#3A2620;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1D1D1B; --ink:#EDECE7; --muted:#A09F98; --faint:#76756F;
  --line:#2D2D2A; --line-strong:#3D3C38; --track:#2A2A27;
  --accent:#7FC2B8; --accent-ink:#0F1E1C; --accent-soft:#1F2F2D;
  --coin:#E0B455; --coin-soft:#3A3122; --danger:#E08A74; --warn-soft:#3A2620;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top-inner{max-width:680px;margin:0 auto;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top.wide .top-inner{max-width:1120px}
.brand{white-space:nowrap;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.top-right{display:flex;align-items:center;gap:12px}
.saved{font-size:12px;color:var(--faint);transition:opacity .3s;opacity:0}
.peek{border:0;background:none;color:var(--faint);opacity:.4;padding:4px;width:26px;height:26px;display:grid;place-items:center;transition:opacity .2s}
.peek:hover,.peek:focus-visible{opacity:1}
.peek svg{width:15px;height:15px}
.link-back{border:0;background:none;color:var(--muted);font-size:14px;padding:0;margin-bottom:14px}
.link-back:hover{color:var(--ink)}
.lockbox{max-width:420px;margin:6vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px}
.lockbox h2{font-size:26px}
.lockbox .btn{margin-top:4px}
.resp-list{display:grid;gap:8px}
.resp{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.resp summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;font-size:14px}
.resp summary::-webkit-details-marker{display:none}
.resp summary::after{content:"+";margin-left:auto;color:var(--faint);font-size:18px;line-height:1}
.resp[open] summary::after{content:"−"}
.resp .num{font-weight:600;font-variant-numeric:tabular-nums}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.resp-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;padding:4px 16px 16px}
.resp-body h5{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.resp-body ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.resp-body li{display:flex;justify-content:space-between;gap:10px}
.resp-body li b{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.resp-body li b.gold{color:var(--coin)}
.resp-body p{margin:0;font-size:14px}
.r-tools{margin-top:18px;font-size:13px;color:var(--muted)}
.r-tools button{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:13px}
.progress{height:2px;background:var(--line)}
.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .4s ease}

/* Contenido */
main{flex:1;width:100%;max-width:680px;margin:0 auto;padding-inline:16px;padding-block:28px 140px}
main.wide{max-width:1120px;padding-bottom:64px}
.section{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:0;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,6.5vw,48px);line-height:1.12;margin-bottom:18px}
h2{font-size:clamp(25px,4.6vw,32px);line-height:1.22;margin-bottom:10px}
.lead{color:var(--muted);margin:0 0 26px;max-width:56ch}
.lead strong{color:var(--ink);font-weight:600}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}

.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 30px;padding:0;list-style:none}
.meta li{font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--surface)}
.notice{font-size:14px;padding:12px 14px;border-radius:10px;background:var(--warn-soft);margin:0 0 22px;max-width:56ch}
.note{font-size:13px;color:var(--muted)}
.error{color:var(--danger);font-size:14px;margin:12px 0 0}
.field{display:block;margin:0 0 20px}
.field > span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.input,.textarea{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:12px 14px;transition:border-color .15s,box-shadow .15s}
.input:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.textarea{min-height:110px;resize:vertical;line-height:1.5}

/* Opciones */
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;transition:border-color .15s,background .15s,transform .1s}
.choice:hover{border-color:var(--line-strong)}
.choice:active{transform:scale(.995)}
.choice .mark{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;transition:all .15s}
.choice.multi .mark{border-radius:6px}
.choice .mark svg{width:12px;height:12px;opacity:0;stroke:var(--accent-ink)}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.choice.on .mark{background:var(--accent);border-color:var(--accent)}
.choice.on .mark svg{opacity:1}
.choice small{display:block;color:var(--muted);font-size:13px}
.choice .key{margin-left:auto;font-size:12px;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 7px}

/* Escalas 1–5 */
.legend{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);margin:0 0 8px;padding:0 2px}
.legend-wrap{display:flex;justify-content:flex-end}
.ask{font-size:15px;font-weight:600;color:var(--accent);margin:0 0 8px}
.legend-strong{display:flex;justify-content:space-between;gap:12px;margin:22px 0 10px;font-size:14px;font-weight:600;color:var(--ink)}
.legend-strong span{display:flex;align-items:center;gap:8px}
.legend-strong b{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.legend-wrap .legend{width:250px}
.rate-list{border-top:1px solid var(--line)}
.rate-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.rate-label{flex:1;min-width:0}
.tag{font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-left:6px}
.scale{display:flex;gap:6px;flex:none}
.dot{width:44px;height:40px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-weight:500;font-size:15px;transition:all .12s;font-variant-numeric:tabular-nums}
.dot:hover{border-color:var(--accent)}
.dot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale.big{gap:8px;width:100%}
.scale.big .dot{flex:1;height:58px;font-size:18px;border-radius:12px}
.remove{border:0;background:none;color:var(--faint);font-size:13px;padding:2px 0;margin-left:8px;text-decoration:underline}
.remove:hover{color:var(--danger)}
.add{display:flex;gap:8px;margin-top:18px}
.add .input{flex:1;min-width:0}
.btn-ghost{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:0 16px;font-weight:500;white-space:nowrap}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}

/* Monedas */
.how{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:0 0 22px;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px}
.how b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1;color:var(--coin)}
.wallet{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:3;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--coin-soft);border-radius:var(--radius);padding:12px 16px;margin:0 0 6px}
.coins{display:flex;gap:6px}
.coin{width:20px;height:20px;border-radius:50%;border:1.5px dashed var(--coin);transition:all .2s}
.coin.full{background:var(--coin);border-style:solid}
.wallet .left{font-size:14px;font-weight:500;text-align:right}
.token-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.token-row .rate-label{cursor:pointer}
.placed{display:flex;gap:4px;margin-top:6px;min-height:12px}
.placed i{width:12px;height:12px;border-radius:50%;background:var(--coin);display:block;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);font-size:18px;line-height:1}
.stepper button:hover:not(:disabled){border-color:var(--coin)}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{min-width:22px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}

/* Sugerencias */
.chips-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 26px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;line-height:1.4;color:var(--muted);transition:all .12s;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.write > span{font-size:15px;font-weight:600;color:var(--ink)}
.write .textarea{min-height:150px;font-size:16px;border-width:1.5px}
.chip.on::before{content:"✓ ";font-weight:600}

/* Navegación */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line)}
.nav-inner{max-width:680px;margin:0 auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.hint{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.btn{border:0;border-radius:999px;padding:13px 26px;font-weight:600;background:var(--accent);color:var(--accent-ink);transition:opacity .15s,transform .1s;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:default}
.btn-back{border:0;background:none;color:var(--muted);padding:10px 4px;font-weight:500;white-space:nowrap}
.btn-back:hover{color:var(--ink)}
.spinner{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.end{padding-top:8vh}
.owner-tools{margin-top:36px;padding-top:24px;border-top:1px solid var(--line);max-width:56ch}
.owner-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.btn-tall{height:48px;border-radius:999px;padding:0 20px}
.confirm{display:inline-flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px}
.btn-danger{border:0;border-radius:999px;padding:10px 18px;font-weight:600;background:var(--danger);color:var(--bg)}
.check{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;margin-bottom:24px}
.check svg{width:26px;height:26px;stroke:var(--accent)}

/* Resultados */
.r-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.r-head h1{font-size:clamp(32px,5vw,40px);margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{font-size:14px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted);margin-top:6px}
.kpi.first .v{color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px 18px;min-width:0}
.card.wide{grid-column:1/-1}
.card h2{font-size:24px;margin-bottom:4px}
.card h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.desc{color:var(--muted);font-size:13px;margin:0 0 14px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 150px 44px;align-items:center;gap:12px;padding:7px 0}
.bar .t{font-size:14px}
.bar .track{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:var(--accent)}
.bar.gold .fill{background:var(--coin)}
.bar .n{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;font-size:14px}
.dist{display:flex;align-items:flex-end;gap:10px;height:120px;margin:10px 0 6px}
.dist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dist span{display:block;width:100%;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.big{font-family:var(--f-display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.quotes{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:360px;overflow:auto}
.quotes li{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px}
.quotes li small{display:block;color:var(--faint);font-size:12px;margin-top:4px}
.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-items:start}
.group{border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.group h4{margin:0 0 2px;font-size:16px;font-weight:600}
.empty{color:var(--faint);font-size:14px;padding:6px 0}
.empty-state{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:36px 24px;text-align:center;color:var(--muted);margin-bottom:12px}
.empty-state strong{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--ink);margin-bottom:6px}

@media (max-width:820px){.kpis{grid-template-columns:1fr 1fr}.grid,.groups{grid-template-columns:1fr}.bar{grid-template-columns:minmax(0,1fr) 80px 36px}}
@media (max-width:560px){
  main{padding-top:22px}
  .rate-row{flex-direction:column;align-items:stretch;gap:10px}
  .rate-row .scale{width:100%}
  .rate-row .dot{flex:1;width:auto;height:44px}
  .legend-wrap .legend{width:100%}
  .token-row{gap:10px}
  .btn{padding:13px 20px}
  .saved{display:none}
}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="top-inner">
    <div class="brand">Necesidades de feedback</div>
    <div class="top-right">
      <div class="saved" id="saved">Avance guardado</div>
      <button type="button" class="peek" id="peek" aria-label="Resultados" title="Resultados"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
    </div>
  </div>
  <div class="progress"><span id="bar"></span></div>
</header>
<main id="app" aria-live="polite"></main>
<nav class="nav" id="nav" hidden><div class="nav-inner">
  <button class="btn-back" id="back" type="button">← Atrás</button>
  <div class="hint" id="hint"></div>
  <button class="btn" id="next" type="button">Continuar</button>
</div></nav>

<script>
/* ============================================================
   CONFIGURACIÓN: lo único que necesitas editar
   ============================================================ */
const CONFIG = {
  // Pega aquí la URL de tu app web de Google Apps Script (termina en /exec).
  // Si la dejas vacía, la página funciona en "modo de prueba" y no guarda nada.
  API_URL: 'https://script.google.com/macros/s/AKfycby1gsIENWvnx05S7MXWpTNdN3eYON8_YmfyhzlHMwmMV4mGIG2fiw0UCeiLCydEerVM1A/exec',
  // Fecha de cierre (opcional), formato AAAA-MM-DD. Después de ese día ya no se puede responder.
  CIERRE: ''
};

/* ============================== CONTENIDO ============================== */
const MONEDAS = 5, MAX_PROPIAS = 3;
const EQUIPOS = ['Staff', 'Estrategia y cultura', 'Gerentes y dirección'];
const INTERES = [
  { id: 'ambas', label: 'Sí, me gustaría ambas' },
  { id: 'dar', label: 'Sí, me gustaría darlo' },
  { id: 'recibir', label: 'Sí, me gustaría recibirlo' },
  { id: 'ninguna', label: 'Ninguna' }
];
const NECESIDADES = [
  'Saber cómo aporto al equipo', 'Saber en qué evolucioné este año', 'Conocer mis oportunidades de mejora',
  'Conocer mi nivel de exposición', 'Que reconozcan mis logros'
];
const NO_VALE = [
  'Que no haya confianza para hablar con franqueza',
  'Que el feedback sea ambiguo y sin ejemplos de referencias',
  'Que sea muy larga',
  'Que se sienta como una crítica',
  'Que no haya seguimiento después',
  'Que no haya un plan accionable',
  'Que quede expuesto frente a todo el equipo'
];
const GRUPOS = [
  { id: 'supervisor', nombre: 'Tu supervisor', corto: 'Mi supervisor', de: 'tu supervisor', sug: [
    'Cómo ve mi desempeño frente a mis objetivos', 'Qué espera de mí el próximo año', 'Mis fortalezas más visibles',
    'En qué debo enfocarme para crecer', 'Reconocimiento concreto de mis logros', 'Cómo aumentar mi visibilidad', 'Cómo puede apoyarme mejor'] },
  { id: 'pares', nombre: 'Tus pares', corto: 'Mis pares', de: 'tus pares', sug: [
    'Cómo es trabajar conmigo', 'Cómo me comunico', 'Qué aporto al equipo', 'Qué debería empezar o dejar de hacer',
    'Cómo manejo los acuerdos y plazos', 'Mi disposición a colaborar'] },
  { id: 'reportes', nombre: 'La persona a tu cargo', nota: 'Si aplica', corto: 'Las personas a mi cargo', de: 'la persona a tu cargo', sug: [
    'Cómo percibe mi estilo de liderazgo', 'Si soy claro con lo que pido', 'Si le doy suficiente autonomía',
    'Si reconozco su trabajo', 'Cómo apoyo su desarrollo', 'Qué necesita más de mí'] },
  { id: 'externos', nombre: 'Externos a la DIENN', corto: 'Externos a la DIENN', de: 'personas externas a la DIENN', sug: [
    'Calidad de lo que entrego', 'Tiempos de respuesta', 'Qué tan fácil es trabajar conmigo',
    'Si entiendo sus necesidades', 'Comunicación y seguimiento', 'Qué valor aporta mi trabajo'] }
];

/* ============================== ESTADO Y AVANCE GUARDADO ============================== */
const PREFIX = 'encuesta-feedback-v4';
const params = new URLSearchParams(location.search);
const DEMO = !CONFIG.API_URL;
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
// Con ?prueba en la dirección puedes responder las veces que quieras sin guardar nada
const PRUEBA = params.has('prueba') || (params.get('c') || '').toUpperCase() === 'PRUEBA';
function nuevoEstado() {
  return { vista: 'inicio', i: 0, enviado: false, verificado: false,
    equipo: null, interes: null, nec: { r: {}, otros: [] }, claridad: null,
    mon: { r: {}, otros: [] }, grupos: [], det: {} };
}
const claveEstado = () => PREFIX + ':' + (PRUEBA || DEMO ? 'prueba' : 'respuesta');
function cargar() {
  try { const raw = ls.get(claveEstado()); return raw ? Object.assign(nuevoEstado(), JSON.parse(raw)) : nuevoEstado(); }
  catch (e) { return nuevoEstado(); }
}
let S = cargar();
let modo = 'encuesta', timerSaved;

function guardar() {
  ls.set(claveEstado(), JSON.stringify(S));
  if (S.vista === 'pregunta' && !S.enviado) {
    const el = document.getElementById('saved'); el.style.opacity = 1;
    clearTimeout(timerSaved); timerSaved = setTimeout(() => el.style.opacity = 0, 1600);
  }
}
function cerrada() {
  if (!CONFIG.CIERRE) return false;
  const fin = new Date(CONFIG.CIERRE + 'T23:59:59');
  return !isNaN(fin) && new Date() > fin;
}

/* ============================== RUTA ============================== */
function pasos() {
  const p = [{ id: 'equipo', sec: 'Sobre ti' }, { id: 'interes', sec: 'Sobre ti' }];
  if (!S.interes) return p;
  if (S.interes !== 'ninguna') {
    p.push({ id: 'necesidades', sec: 'Diagnóstico individual' }, { id: 'claridad', sec: 'Diagnóstico individual' }, { id: 'grupos', sec: 'Feedback 360' });
    GRUPOS.filter(g => S.grupos.includes(g.id)).forEach(g => p.push({ id: 'g:' + g.id, sec: 'Feedback 360' }));
  }
  p.push({ id: 'monedas', sec: 'La sesión de feedback' });
  return p;
}

/* ============================== PIEZAS ============================== */
const $app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CHECK = '<svg viewBox="0 0 12 12" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2 5 8.6l4.5-5"/></svg>';
const usadas = () => NO_VALE.reduce((a, t) => a + (S.mon.r[t] || 0), 0) + S.mon.otros.reduce((a, o) => a + (o.v || 0), 0);
const quedan = () => MONEDAS - usadas();

function choice(act, value, label, on, o = {}) {
  return `<button type="button" class="choice ${o.multi ? 'multi' : ''} ${on ? 'on' : ''}" data-act="${act}" data-v="${esc(value)}" aria-pressed="${on}">
    <span class="mark">${CHECK}</span><span>${esc(label)}${o.small ? `<small>${esc(o.small)}</small>` : ''}</span>
    ${o.key ? `<span class="key" aria-hidden="true">${o.key}</span>` : ''}</button>`;
}
function escala(g, k, valor, big) {
  return `<div class="scale ${big ? 'big' : ''}" role="radiogroup">${[1, 2, 3, 4, 5].map(n =>
    `<button type="button" class="dot ${valor === n ? 'on' : ''}" data-act="rate" data-g="${g}" data-k="${esc(k)}" data-n="${n}" role="radio" aria-checked="${valor === n}" aria-label="${n}">${n}</button>`).join('')}</div>`;
}
function agregar(g, n, ayuda) {
  if (n >= MAX_PROPIAS) return '';
  return `<div class="add"><input class="input" id="add-${g}" maxlength="120" placeholder="¿Falta algo? Escríbelo aquí" aria-label="Agregar otra opción">
    <button class="btn-ghost" type="button" data-act="add" data-g="${g}">Agregar</button></div><p class="note" style="margin-top:8px">${ayuda}</p>`;
}

const PANTALLAS = {
  equipo: () => `<h2>¿De qué equipo eres?</h2><p class="lead">Solo lo usamos para ver los resultados por grupo.</p>
    <div class="choices">${EQUIPOS.map((e, i) => choice('equipo', e, e, S.equipo === e, { key: i + 1 })).join('')}</div>`,

  interes: () => `<h2>¿Te gustaría dar y recibir feedback?</h2><p class="lead">No hay respuesta correcta. Según lo que elijas te mostraremos unas preguntas u otras.</p>
    <div class="choices">${INTERES.map((o, i) => choice('interes', o.id, o.label, S.interes === o.id, { key: i + 1 })).join('')}</div>`,

  necesidades: () => {
    const filas = NECESIDADES.map(t => `<div class="rate-row"><div class="rate-label">${esc(t)}</div>${escala('nec', t, S.nec.r[t])}</div>`).join('')
      + S.nec.otros.map((o, i) => `<div class="rate-row"><div class="rate-label">${esc(o.t)}<span class="tag">Tuya</span><button class="remove" type="button" data-act="rm" data-g="nec" data-i="${i}">Quitar</button></div>${escala('nec', 'o:' + i, o.v)}</div>`).join('');
    return `<h2>De cara a un feedback, ¿qué necesitas más hoy?</h2><p class="lead">Califica cada opción del 1 al 5.</p>
      <div class="legend-wrap"><div class="legend"><span>1 · Lo necesito poco</span><span>5 · Mucho</span></div></div>
      <div class="rate-list">${filas}</div>${agregar('nec', S.nec.otros.length, 'Cuando la agregues, ponle puntaje también.')}`;
  },

  claridad: () => `<p class="ask">¿Qué tan de acuerdo estás?</p><h2>Hoy sé con claridad cómo voy en mi desempeño.</h2>
    <div class="legend-strong"><span><b>1</b> Totalmente en desacuerdo</span><span>Totalmente de acuerdo <b>5</b></span></div>
    ${escala('clar', 'claridad', S.claridad, true)}`,

  grupos: () => `<h2>Te gustaría tener feedback con:</h2><p class="lead">Elige todas las que quieras.</p>
    <div class="choices">${GRUPOS.map((g, i) => choice('grupo', g.id, g.nombre, S.grupos.includes(g.id), { multi: true, small: g.nota, key: i + 1 })).join('')}</div>`,

  monedas: () => {
    const q = quedan();
    const fila = (k, label, n, extra = '') => `<div class="token-row">
      <div class="rate-label" data-act="coin+" data-k="${esc(k)}">${esc(label)}${extra}<div class="placed">${'<i></i>'.repeat(n)}</div></div>
      <div class="stepper"><button type="button" data-act="coin-" data-k="${esc(k)}" ${n ? '' : 'disabled'} aria-label="Quitar una moneda de: ${esc(label)}">−</button>
      <output>${n}</output><button type="button" data-act="coin+" data-k="${esc(k)}" ${q ? '' : 'disabled'} aria-label="Poner una moneda en: ${esc(label)}">+</button></div></div>`;
    return `<h2>¿Qué hace que una sesión de feedback no valga la pena?</h2>
      <p class="lead">Queremos saber qué pesa más para ti, así que en vez de calificar vas a repartir monedas según tu prioridad.</p>
      <div class="how"><b>1</b><span>Tienes <strong>${MONEDAS} monedas</strong>. Cada moneda es un voto.</span>
        <b>2</b><span>Ponlas en lo que <strong>más</strong> te haría sentir que la sesión no vale la pena. Usa <strong>+</strong> y <strong>−</strong>.</span>
        <b>3</b><span>Puedes poner varias en una sola opción o repartirlas. Más monedas = más prioridad.</span>
        <b>4</b><span>¿Falta algo? Escríbelo abajo y ponle monedas también.</span></div>
      <div class="wallet"><div class="coins" aria-hidden="true">${Array.from({ length: MONEDAS }, (_, i) => `<span class="coin ${i < q ? 'full' : ''}"></span>`).join('')}</div>
        <div class="left">${q === 0 ? 'Usaste todas tus monedas' : `Te ${q === 1 ? 'queda 1 moneda' : 'quedan ' + q + ' monedas'}`}</div></div>
      <div>${NO_VALE.map(t => fila(t, t, S.mon.r[t] || 0)).join('')}
      ${S.mon.otros.map((o, i) => fila('o:' + i, o.t, o.v || 0, `<span class="tag">Tuya</span><button class="remove" type="button" data-act="rm" data-g="mon" data-i="${i}">Quitar</button>`)).join('')}</div>
      ${agregar('mon', S.mon.otros.length, 'Cuando la agregues aparecerá en la lista para que le pongas monedas.')}`;
  }
};

function pantallaGrupo(id) {
  const g = GRUPOS.find(x => x.id === id);
  const d = S.det[id] || (S.det[id] = { sug: [], texto: '' });
  return `<h2>¿Qué te gustaría obtener del feedback de ${esc(g.de)}?</h2>
    <p class="lead">Escríbelo con tus palabras o toca alguna de las ideas sugeridas.</p>
    <p class="chips-label">Ideas sugeridas</p>
    <div class="chips">${g.sug.map(s => `<button type="button" class="chip ${d.sug.includes(s) ? 'on' : ''}" data-act="sug" data-g="${id}" data-v="${esc(s)}" aria-pressed="${d.sug.includes(s)}">${esc(s)}</button>`).join('')}</div>
    <label class="field write"><span>Con tus palabras</span>
      <textarea class="textarea" id="det-${id}" data-bind="det:${id}" maxlength="1500" placeholder="Por ejemplo: qué esperas saber, qué te ayudaría a crecer…">${esc(d.texto)}</textarea></label>`;
}

function faltan(id) {
  if (id === 'equipo') return S.equipo ? '' : 'Elige una opción';
  if (id === 'interes') return S.interes ? '' : 'Elige una opción';
  if (id === 'necesidades') { const n = NECESIDADES.filter(t => !S.nec.r[t]).length + S.nec.otros.filter(x => !x.v).length; return n ? `${n === 1 ? 'Falta 1 opción' : 'Faltan ' + n + ' opciones'} por calificar` : ''; }
  if (id === 'claridad') return S.claridad ? '' : 'Elige un número';
  if (id === 'grupos') return S.grupos.length ? '' : 'Elige al menos una opción';
  if (id === 'monedas') { const q = quedan(); return q ? `Te ${q === 1 ? 'falta 1 moneda' : 'faltan ' + q + ' monedas'} por ubicar` : ''; }
  if (id.startsWith('g:')) { const d = S.det[id.slice(2)] || { sug: [], texto: '' }; return (d.sug.length || d.texto.trim()) ? '' : 'Elige una idea o escribe algo'; }
  return '';
}

/* ============================== RENDER ENCUESTA ============================== */
const $nav = document.getElementById('nav'), $next = document.getElementById('next'), $back = document.getElementById('back'),
  $hint = document.getElementById('hint'), $bar = document.getElementById('bar');

function render(anim = true) {
  document.getElementById('top').classList.remove('wide'); $app.classList.remove('wide');
  if (modo === 'resultados') return renderResultados();
  if (S.enviado) return renderFin();
  if (cerrada()) return renderCerrada();
  if (S.vista === 'inicio') return renderInicio();
  const P = pasos();
  if (S.i >= P.length) S.i = P.length - 1;
  const paso = P[S.i];
  const html = paso.id.startsWith('g:') ? pantallaGrupo(paso.id.slice(2)) : PANTALLAS[paso.id]();
  $app.innerHTML = `<div class="${anim ? 'fade' : ''}"><p class="section">${esc(paso.sec)}</p>${html}</div>`;
  $bar.style.width = Math.round(progreso(paso) * 100) + '%';
  $nav.hidden = false;
  actualizarNav();
}
// La barra solo avanza: los pasos de cada persona del 360 comparten un tramo fijo,
// así que elegir o quitar personas no la hace retroceder.
function progreso(paso) {
  if (S.interes === 'ninguna') return { equipo: 0, interes: 1 / 3, monedas: 2 / 3 }[paso.id] || 0;
  const base = { equipo: 0, interes: 1, necesidades: 2, claridad: 3, grupos: 4, monedas: 7 };
  if (paso.id in base) return base[paso.id] / 8;
  const elegidos = GRUPOS.filter(g => S.grupos.includes(g.id)).map(g => g.id);
  const idx = Math.max(0, elegidos.indexOf(paso.id.slice(2)));
  return (5 + 2 * idx / Math.max(1, elegidos.length)) / 8;
}
function actualizarNav() {
  const P = pasos(), paso = P[S.i], ultimo = paso.id === 'monedas';
  const msg = faltan(paso.id);
  $next.disabled = !!msg;
  $next.textContent = ultimo ? 'Enviar respuestas' : 'Continuar';
  $hint.textContent = msg;
}
function fechaBonita(iso) { const d = new Date(iso + 'T12:00:00'); return isNaN(d) ? iso : d.toLocaleDateString('es', { day: 'numeric', month: 'long' }); }
function renderInicio(error = '') {
  $nav.hidden = true; $bar.style.width = '0%';
  const empezado = S.equipo !== null;
  $app.innerHTML = `<div class="fade">
    ${DEMO ? '<p class="notice">Modo de prueba: esta página todavía no está conectada a Google, así que las respuestas no se guardan.</p>' : PRUEBA ? '<p class="notice">Modo de prueba: puedes responder las veces que quieras y no se guarda nada.</p>' : ''}
    <h1>¿Qué necesitas de tu próximo feedback?</h1>
    <p class="lead">Queremos conocer qué busca el equipo en sus espacios de feedback para acompañarlos y aportar valor en las sesiones o iniciativas que tengamos.</p>
    <ul class="meta"><li>Unos 3 minutos</li><li>Anónima</li><li>Tu avance se guarda solo</li>${CONFIG.CIERRE ? `<li>Cierra el ${fechaBonita(CONFIG.CIERRE)}</li>` : ''}</ul>
    <button class="btn" id="start" type="button">${empezado ? 'Continuar donde quedé' : 'Empezar'} →</button>
    ${error ? `<p class="error">${esc(error)}</p>` : ''}
    <p class="note" style="margin-top:28px">Tus respuestas no se asocian a tu nombre ni a tu correo. Puedes responder una sola vez.</p></div>`;
  document.getElementById('start').onclick = empezar;
}
function renderFin(titulo = 'Gracias por tu tiempo', texto = 'Tu respuesta quedó registrada. Con lo que nos cuentas vamos a diseñar una sesión de feedback que de verdad te sirva.') {
  $nav.hidden = true; $bar.style.width = '100%';
  $app.innerHTML = `<div class="end fade"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17l9-10"/></svg></div>
    <h1>${esc(titulo)}</h1><p class="lead">${esc(texto)}</p>
    ${DEMO || PRUEBA ? '<p class="note">Respuesta de prueba: no se guardó.</p>' : ''}
    ${DEMO || PRUEBA ? '<button class="btn-ghost btn-tall" type="button" id="otra">Probar otra vez</button>' : ''}</div>`;
  const o = document.getElementById('otra');
  if (o) o.onclick = () => { S = nuevoEstado(); S.verificado = true; S.vista = 'pregunta'; guardar(); render(); window.scrollTo(0, 0); };
}
function renderCerrada() {
  $nav.hidden = true; $bar.style.width = '0%';
  $app.innerHTML = `<div class="end fade"><h1>La encuesta ya cerró</h1><p class="lead">Gracias por tu interés. Si crees que es un error, escríbele a quien te envió el enlace.</p></div>`;
}

/* ============================== SERVIDOR (Google Apps Script) ============================== */
async function api(payload) {
  const res = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(payload) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
const MOTIVOS = {
  invalido: 'Ese código no existe. Revisa que el enlace esté completo o pide uno nuevo.',
  usado: 'Ese enlace ya se usó para responder. Cada persona puede responder una sola vez.',
  cerrada: 'La encuesta ya cerró.',
  formato: 'No pudimos leer la respuesta. Intenta de nuevo.'
};
function empezar() {
  S.vista = 'pregunta'; guardar(); render(); window.scrollTo(0, 0);
}

/* ============================== ENVÍO ============================== */
function hoy() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function armarRespuesta() {
  const otros = o => o.otros.filter(x => x.t.trim()).map(x => ({ texto: x.t.trim(), valor: x.v || 0 }));
  const r = { version: 2, fecha: hoy(), equipo: S.equipo, interes: S.interes,
    monedas: { valores: Object.fromEntries(NO_VALE.map(t => [t, S.mon.r[t] || 0])), otros: otros(S.mon) } };
  if (S.interes !== 'ninguna') {
    r.necesidades = { valores: Object.fromEntries(NECESIDADES.map(t => [t, S.nec.r[t]])), otros: otros(S.nec) };
    r.claridad = S.claridad;
    r.feedback360 = GRUPOS.filter(g => S.grupos.includes(g.id)).map(g => ({ id: g.id, sugerencias: (S.det[g.id] || {}).sug || [], texto: ((S.det[g.id] || {}).texto || '').trim() }));
  }
  return r;
}
async function enviar() {
  $next.disabled = true; $next.innerHTML = '<span class="spinner"></span> Enviando';
  try {
    if (DEMO) { await new Promise(r => setTimeout(r, 500)); }
    else {
      const r = await api({ accion: 'enviar', prueba: PRUEBA, respuesta: armarRespuesta() });
      if (!r.ok) {
        $hint.textContent = MOTIVOS[r.motivo] || 'No se pudo enviar. Intenta de nuevo.'; $next.disabled = false; $next.textContent = 'Reintentar'; return;
      }
    }
    // Se borran las respuestas del dispositivo; solo queda la marca de "enviado"
    S = Object.assign(nuevoEstado(), { enviado: true }); guardar(); render(); window.scrollTo(0, 0);
  } catch (e) {
    $hint.textContent = 'Sin conexión. Tus respuestas siguen guardadas; intenta de nuevo.';
    $next.disabled = false; $next.textContent = 'Reintentar';
  }
}

/* ============================== INTERACCIÓN ============================== */
function siguiente() {
  const P = pasos();
  if (faltan(P[S.i].id)) return;
  if (P[S.i].id === 'monedas') return enviar();
  S.i++; guardar(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function atras() {
  if (S.i === 0) { S.vista = 'inicio'; guardar(); return render(); }
  S.i--; guardar(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
$next.onclick = siguiente; $back.onclick = atras;
let autoTimer; const auto = () => { clearTimeout(autoTimer); autoTimer = setTimeout(siguiente, 320); };
const obj = g => g === 'nec' ? S.nec : S.mon;
function agregarOpcion(g) {
  const inp = document.getElementById('add-' + g), t = (inp && inp.value || '').trim();
  if (!t) { inp && inp.focus(); return; }
  const o = obj(g); if (o.otros.length >= MAX_PROPIAS) return;
  o.otros.push({ t, v: g === 'mon' ? 0 : null }); guardar(); render(false);
}
function toggleGrupo(id) { S.grupos = S.grupos.includes(id) ? S.grupos.filter(x => x !== id) : [...S.grupos, id]; guardar(); render(false); }

$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v, g = b.dataset.g, k = b.dataset.k;
  if (act === 'equipo') { S.equipo = v; guardar(); render(false); auto(); }
  else if (act === 'interes') { S.interes = v; guardar(); render(false); auto(); }
  else if (act === 'grupo') toggleGrupo(v);
  else if (act === 'rate') {
    const n = +b.dataset.n;
    if (g === 'clar') { S.claridad = n; guardar(); render(false); return auto(); }
    if (k.startsWith('o:')) S.nec.otros[+k.slice(2)].v = n; else S.nec.r[k] = n;
    guardar(); render(false);
  }
  else if (act === 'add') agregarOpcion(g);
  else if (act === 'rm') { obj(g).otros.splice(+b.dataset.i, 1); guardar(); render(false); }
  else if (act === 'coin+' || act === 'coin-') {
    const d = act === 'coin+' ? 1 : -1;
    if (d > 0 && quedan() <= 0) return;
    if (k.startsWith('o:')) { const o = S.mon.otros[+k.slice(2)]; o.v = Math.max(0, (o.v || 0) + d); }
    else S.mon.r[k] = Math.max(0, (S.mon.r[k] || 0) + d);
    guardar(); render(false);
  }
  else if (act === 'sug') {
    const d = S.det[g] || (S.det[g] = { sug: [], texto: '' });
    d.sug = d.sug.includes(v) ? d.sug.filter(x => x !== v) : [...d.sug, v]; guardar(); render(false);
  }
  else if (act === 'filtro') { filtro = v; renderResultados(); }
  else if (act === 'volver') cambiarModo('encuesta');
  else if (act === 'actualizar') actualizarResultados();
  else if (act === 'salir') { respuestas = null; claveRes = ''; renderResultados(); }
});
$app.addEventListener('input', e => {
  const bind = e.target.dataset.bind; if (!bind) return;
  const id = bind.slice(4); (S.det[id] || (S.det[id] = { sug: [], texto: '' })).texto = e.target.value;
  guardar(); actualizarNav();
});
$app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('add-')) { e.preventDefault(); agregarOpcion(e.target.id.slice(4)); }
});
document.addEventListener('keydown', e => {
  if (modo !== 'encuesta' || S.vista !== 'pregunta' || S.enviado) return;
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'textarea' || tag === 'input') return;
  const paso = pasos()[S.i];
  if (e.key === 'Enter' && !$next.disabled) { e.preventDefault(); return siguiente(); }
  const n = parseInt(e.key, 10); if (!n) return;
  if (paso.id === 'equipo' && EQUIPOS[n - 1]) { S.equipo = EQUIPOS[n - 1]; guardar(); render(false); auto(); }
  else if (paso.id === 'interes' && INTERES[n - 1]) { S.interes = INTERES[n - 1].id; guardar(); render(false); auto(); }
  else if (paso.id === 'claridad' && n <= 5) { S.claridad = n; guardar(); render(false); auto(); }
  else if (paso.id === 'grupos' && GRUPOS[n - 1]) toggleGrupo(GRUPOS[n - 1].id);
});

/* ============================== RESULTADOS (con clave) ============================== */
// La clave se revisa en el servidor: sin la clave correcta, Google no entrega ninguna respuesta.
let respuestas = null, filtro = 'Todos', claveRes = '', errorClave = '', infoCodigos = null, horaCarga = '';
const prom = a => { const v = a.filter(x => typeof x === 'number' && x > 0); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const f1 = n => n == null ? '–' : n.toFixed(1).replace('.', ',');
function barras(items, max, clase) {
  if (!items.length) return '<div class="empty">Sin datos todavía.</div>';
  return items.map(it => `<div class="bar ${clase || ''}"><div class="t">${esc(it.t)}${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ''}</div>
    <div class="track"><div class="fill" style="width:${it.v ? Math.max(2, it.v / max * 100) : 0}%"></div></div><div class="n">${it.fmt != null ? it.fmt : f1(it.v)}</div></div>`).join('');
}
function citas(items) {
  if (!items.length) return '<div class="empty">Nada por ahora.</div>';
  return '<ul class="quotes">' + items.map(q => `<li>${esc(q.t)}${q.s ? `<small>${esc(q.s)}</small>` : ''}</li>`).join('') + '</ul>';
}
function cambiarModo(m) {
  modo = m; errorClave = '';
  render(); window.scrollTo(0, 0);
}
document.getElementById('peek').onclick = () => cambiarModo(modo === 'resultados' ? 'encuesta' : 'resultados');

async function cargarResultados() {
  const r = await api({ accion: 'resultados', clave: claveRes });
  if (!r.ok) throw { mensaje: r.motivo === 'clave' ? 'Clave incorrecta.' : r.motivo === 'bloqueado' ? 'Demasiados intentos. Espera 10 minutos e intenta de nuevo.' : 'No se pudieron cargar los resultados.' };
  respuestas = r.respuestas || [];
  horaCarga = new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
}
async function actualizarResultados() {
  const b = document.querySelector('[data-act="actualizar"]'); if (b) { b.disabled = true; b.textContent = 'Actualizando…'; }
  try { await cargarResultados(); } catch (e) { respuestas = null; errorClave = e.mensaje || 'No se pudieron cargar los resultados.'; }
  renderResultados();
}
function cabecera(sub, conFiltros) {
  const filtros = conFiltros ? `<div class="filters">${['Todos', ...EQUIPOS].map(e => `<button type="button" class="${e === filtro ? 'on' : ''}" data-act="filtro" data-v="${esc(e)}">${esc(e)}</button>`).join('')}</div>` : '';
  return `<button type="button" class="link-back" data-act="volver">← Volver a la encuesta</button>
    <div class="r-head"><div><h1>Resultados</h1><div class="sub">${sub}</div></div>${filtros}</div>`;
}
function pantallaLlave(titulo, texto, campos, boton, nota) {
  return `<div class="lockbox fade"><h2>${titulo}</h2><p class="lead" style="margin-bottom:20px">${texto}</p>
    <form id="form-clave" autocomplete="off">${campos.map(c => `<label class="field"><span>${c.label}</span><input class="input" type="password" id="${c.id}" autocomplete="${c.ac || 'current-password'}"></label>`).join('')}
    <button class="btn" type="submit" id="btn-clave">${boton}</button>${errorClave ? `<p class="error">${esc(errorClave)}</p>` : ''}</form>
    ${nota ? `<p class="note" style="margin-top:18px">${nota}</p>` : ''}</div>`;
}
function conectarFormulario(fn) {
  const f = document.getElementById('form-clave'); if (!f) return;
  const primero = f.querySelector('input'); if (primero) setTimeout(() => primero.focus(), 50);
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const b = document.getElementById('btn-clave'); b.disabled = true; b.innerHTML = '<span class="spinner"></span> Un momento';
    errorClave = '';
    try { await fn(); } catch (err) { errorClave = (err && err.mensaje) || 'Algo salió mal. Intenta de nuevo.'; }
    renderResultados();
  });
}
const val = id => (document.getElementById(id) || {}).value || '';
function revisarNueva(a, b) {
  if (a.length < 6) throw { mensaje: 'La clave debe tener al menos 6 caracteres.' };
  if (a !== b) throw { mensaje: 'Las dos claves no coinciden.' };
}

function renderResultados() {
  document.getElementById('top').classList.add('wide'); $app.classList.add('wide');
  $nav.hidden = true; $bar.style.width = '0%';
  const volver = '<button type="button" class="link-back" data-act="volver">← Volver a la encuesta</button>';
  if (DEMO) { $app.innerHTML = volver + '<div class="lockbox"><h2>Resultados</h2><p class="lead">Los resultados estarán disponibles cuando la página esté conectada a Google.</p></div>'; return; }
  if (respuestas === null) {
    $app.innerHTML = volver + pantallaLlave('Resultados', 'Escribe la clave para ver las respuestas.', [{ id: 'k0', label: 'Clave' }], 'Ver resultados', '');
    conectarFormulario(async () => {
      claveRes = val('k0');
      try { await cargarResultados(); } catch (e) { if (e && e.mensaje) throw e; throw { mensaje: 'No hay conexión con el servidor. Intenta de nuevo.' }; }
    });
    return;
  }
  const sub = `Actualizado a las ${horaCarga} · <button type="button" class="remove" data-act="actualizar" style="margin:0">Actualizar</button>`;
  const head = cabecera(sub, true);
  const R = respuestas.filter(r => filtro === 'Todos' || r.equipo === filtro);
  if (!R.length) {
    $app.innerHTML = head + `<div class="empty-state"><strong>Todavía no hay respuestas${filtro === 'Todos' ? '' : ' de ' + esc(filtro)}</strong>
      Cuando alguien envíe la encuesta, aquí verás sus prioridades, lo que necesita del feedback y con quién quiere tenerlo.</div>`;
    return;
  }
  const si = R.filter(r => r.interes !== 'ninguna');
  const cuenta = id => R.filter(r => r.interes === id).length;
  const pct = n => Math.round(n / R.length * 100) + '%';

  const nec = NECESIDADES.map(t => ({ t, v: prom(si.map(r => r.necesidades && r.necesidades.valores[t])) })).sort((a, b) => (b.v || 0) - (a.v || 0));
  const necOtros = si.flatMap(r => ((r.necesidades && r.necesidades.otros) || []).map(o => ({ t: o.texto, s: 'Agregada por alguien de ' + r.equipo + ' · puntaje ' + o.valor + ' de 5' })));
  const dist = [1, 2, 3, 4, 5].map(n => si.filter(r => r.claridad === n).length), maxD = Math.max(1, ...dist);

  // Opciones predeterminadas (aunque tengan 0) + las que agregaron los participantes, sumadas por texto
  const tablaMonedas = lista => {
    const filas = NO_VALE.map(t => ({ t, v: lista.reduce((a, r) => a + ((r.monedas && r.monedas.valores[t]) || 0), 0) }));
    const propias = {};
    lista.forEach(r => ((r.monedas && r.monedas.otros) || []).forEach(o => {
      const k = o.texto.trim().toLowerCase();
      if (!propias[k]) propias[k] = { t: o.texto.trim(), v: 0, eq: {} };
      propias[k].v += o.valor || 0; propias[k].eq[r.equipo] = (propias[k].eq[r.equipo] || 0) + 1;
    }));
    const grupos = eq => Object.entries(eq).map(([e, n]) => n > 1 ? `${e} (${n})` : e).join(', ');
    Object.values(propias).forEach(o => filas.push({ t: o.t, v: o.v, tag: 'Agregada · ' + grupos(o.eq) }));
    filas.sort((a, b) => b.v - a.v).forEach(m => m.fmt = String(m.v));
    return filas;
  };
  const mon = tablaMonedas(R), maxM = Math.max(1, ...mon.map(m => m.v));
  const soloNinguna = R.filter(r => r.interes === 'ninguna');
  const monNinguna = soloNinguna.length && soloNinguna.length < R.length ? tablaMonedas(soloNinguna) : [];
  const grupos = GRUPOS.map(g => {
    const rs = si.flatMap(r => (r.feedback360 || []).filter(x => x.id === g.id).map(x => Object.assign({ equipo: r.equipo }, x)));
    const c = {}; rs.forEach(x => (x.sugerencias || []).forEach(s => c[s] = (c[s] || 0) + 1));
    const top = Object.entries(c).sort((a, b) => b[1] - a[1]).map(([t, v]) => ({ t, v, fmt: String(v) }));
    return { g, n: rs.length, top, textos: rs.filter(x => x.texto).map(x => ({ t: x.texto, s: 'Escrita por alguien de ' + x.equipo })), max: Math.max(1, ...top.map(x => x.v)) };
  });

  $app.innerHTML = head + `
  <div class="kpis">
    <div class="kpi first"><div class="v">${R.length}</div><div class="l">Respuestas</div></div>
    ${INTERES.map(o => `<div class="kpi"><div class="v">${cuenta(o.id)}</div><div class="l">${esc(o.label)} · ${pct(cuenta(o.id))}</div></div>`).join('')}
  </div>
  <div class="grid">
    <div class="card wide">
      <h2>¿Qué hace que una sesión de feedback no valga la pena?</h2>
      <p class="desc">Total de monedas por opción, incluidas las que agregaron los participantes · ${R.length} ${R.length === 1 ? 'persona' : 'personas'} · ${R.length * MONEDAS} monedas repartidas</p>
      ${barras(mon, maxM, 'gold')}
      ${monNinguna.length ? `<h3>Solo quienes respondieron "Ninguna"</h3><p class="desc">${soloNinguna.length} ${soloNinguna.length === 1 ? 'persona' : 'personas'}</p>${barras(monNinguna, Math.max(1, ...monNinguna.map(m => m.v)), 'gold')}` : ''}
    </div>
    <div class="card">
      <h2>¿Qué necesitan más hoy?</h2><p class="desc">Promedio del 1 al 5 · ${si.length} ${si.length === 1 ? 'persona' : 'personas'} que quieren dar o recibir feedback</p>
      ${barras(nec, 5)}<h3>Otras necesidades que escribieron</h3>${citas(necOtros)}
    </div>
    <div class="card">
      <h2>Claridad sobre su desempeño</h2><p class="desc">“Hoy sé con claridad cómo voy en mi desempeño”</p>
      <div class="big">${f1(prom(si.map(r => r.claridad)))}<span style="font-size:20px;color:var(--faint)"> / 5</span></div>
      <div class="dist">${dist.map((c, i) => `<div>${c}<span style="height:${c / maxD * 80}%"></span>${i + 1}</div>`).join('')}</div>
      <p class="desc" style="margin-top:8px">1 = totalmente en desacuerdo · 5 = totalmente de acuerdo</p>
    </div>
    <div class="card wide">
      <h2>Feedback 360</h2><p class="desc">Con quién quieren tener feedback y qué esperan obtener</p>
      <div class="groups">${grupos.map(x => `<div class="group"><h4>${esc(x.g.corto)}</h4>
        <p class="desc">${x.n} ${x.n === 1 ? 'persona lo eligió' : 'personas lo eligieron'}${si.length ? ' · ' + Math.round(x.n / si.length * 100) + '%' : ''}</p>
        ${x.top.length ? barras(x.top, x.max) : '<div class="empty">Sin ideas elegidas.</div>'}
        ${x.textos.length ? '<h3>Con sus palabras</h3>' + citas(x.textos) : ''}</div>`).join('')}</div>
    </div>
    <div class="card wide">
      <h2>Todas las respuestas</h2><p class="desc">${R.length} ${R.length === 1 ? 'respuesta' : 'respuestas'}${filtro === 'Todos' ? '' : ' de ' + esc(filtro)} · toca una para ver el detalle</p>
      <div class="resp-list">${R.slice().sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || ''))).map((r, i) => detalleRespuesta(r, i + 1)).join('')}</div>
    </div>
  </div>
  <p class="r-tools"><button type="button" data-act="salir">Cerrar resultados</button></p>`;
}

function detalleRespuesta(r, n) {
  const fecha = (() => { const d = new Date((r.fecha || '') + 'T12:00:00'); return isNaN(d) ? '' : d.toLocaleDateString('es', { day: 'numeric', month: 'short' }); })();
  const interes = (INTERES.find(o => o.id === r.interes) || {}).label || '';
  const mon = Object.entries((r.monedas && r.monedas.valores) || {}).filter(([, v]) => v > 0).map(([t, v]) => ({ t, v }))
    .concat(((r.monedas && r.monedas.otros) || []).map(o => ({ t: o.texto, v: o.valor || 0, propia: true }))).sort((a, b) => b.v - a.v);
  const lista = items => items.length ? `<ul>${items.join('')}</ul>` : '<p class="empty">—</p>';
  const bloques = [`<div><h5>No vale la pena (monedas)</h5>${lista(mon.map(m => `<li><span>${esc(m.t)}${m.propia ? '<span class="tag">Agregada</span>' : ''}</span><b class="gold">${m.v}</b></li>`))}</div>`];
  if (r.interes !== 'ninguna') {
    const nec = Object.entries((r.necesidades && r.necesidades.valores) || {}).map(([t, v]) => ({ t, v }))
      .concat(((r.necesidades && r.necesidades.otros) || []).map(o => ({ t: o.texto, v: o.valor, propia: true })));
    bloques.push(`<div><h5>Qué necesita hoy (1–5)</h5>${lista(nec.map(x => `<li><span>${esc(x.t)}${x.propia ? '<span class="tag">Agregada</span>' : ''}</span><b>${x.v || '–'}</b></li>`))}
      <h5 style="margin-top:14px">Claridad de desempeño</h5><p>${r.claridad || '–'} de 5</p></div>`);
    const g360 = (r.feedback360 || []).map(x => {
      const g = GRUPOS.find(gg => gg.id === x.id) || { corto: x.id };
      const partes = (x.sugerencias || []).map(esc).concat(x.texto ? ['“' + esc(x.texto) + '”'] : []);
      return `<li style="display:block"><b>${esc(g.corto)}</b><br><span style="color:var(--muted)">${partes.join(' · ') || '—'}</span></li>`;
    });
    bloques.push(`<div><h5>Feedback 360</h5>${lista(g360)}</div>`);
  }
  return `<details class="resp"><summary><span class="num">#${n}</span><span class="pill">${esc(r.equipo || '')}</span><span>${esc(interes)}</span>${fecha ? `<span class="pill">${esc(fecha)}</span>` : ''}</summary>
    <div class="resp-body">${bloques.join('')}</div></details>`;
}

/* ============================== ARRANQUE ============================== */
render();
</script>
</body>
</html>
